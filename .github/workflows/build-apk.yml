name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release and Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies (Capacitor Android Core)
        run: npm ci --ignore-scripts

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android Licenses & SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew




      - name: Build Android APKs (Debug & Release)
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: List Generated APKs
        run: |
          echo "=== SEARCHING ALL BUILT APKS ==="
          find . -name "*.apk"

      - name: Upload APKs to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: RoraimaExchange-APKs
          path: '**/*.apk'
          retention-days: 30



